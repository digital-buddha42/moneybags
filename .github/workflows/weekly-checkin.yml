name: Weekly YNAB Budget Check-in

on:
  schedule:
    # 19:00 America/Phoenix (UTC-7, no DST — Arizona doesn't observe it) =
    # 02:00 UTC the following day. This stays correct year-round.
    - cron: "0 2 * * 1"
  workflow_dispatch: {}

jobs:
  checkin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python ynab_checkin.py
        env:
          YNAB_TOKEN: ${{ secrets.YNAB_TOKEN }}
          YNAB_BUDGET_ID: ${{ secrets.YNAB_BUDGET_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
